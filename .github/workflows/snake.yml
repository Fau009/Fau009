name: Atualizar README (Snake + Stats)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Usa o token pessoal (secret GH_PAT) se existir, para incluir contribuições privadas.
      # Sem o secret, cai no token padrão do Actions (só contribuições públicas).
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GH_PAT || github.token }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical&include_all_commits=true&count_private=true&hide_border=true
          path: dist/stats.svg
          token: ${{ secrets.GH_PAT || github.token }}

      - name: generate top-langs card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=7&theme=radical&hide_border=true&hide=jupyter notebook
          path: dist/top-langs.svg
          token: ${{ secrets.GH_PAT || github.token }}

      - name: generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: collect 3D graph
        run: cp profile-3d-contrib/profile-night-rainbow.svg dist/contrib-3d.svg

      - name: push svgs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
